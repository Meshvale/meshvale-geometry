# SPDX-License-Identifier: Apache-2.0
name: Repository checks

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Check portable repository contents
        run: python scripts/check-portability.py
      - name: Check documentation and environment template
        run: python scripts/check-docs.py
      - name: Install pinned C++ formatter
        run: python -m pip install clang-format==23.1.3
      - name: Check Google C++ formatting
        run: python scripts/check-cpp-format.py

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake -S . -B .local/build -DCMAKE_BUILD_TYPE=Release
      - name: Configure native libraries without Python discovery
        run: >-
          cmake -S . -B .local/native-only -DBUILD_TESTING=OFF
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_DISABLE_FIND_PACKAGE_Python=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_Python3=ON -DCMAKE_DISABLE_FIND_PACKAGE_nanobind=ON
      - name: Build native libraries without Python
        run: cmake --build .local/native-only --config Release
      - name: Build and inspect storage
        run: cmake --build .local/build --config Release
      - name: Test
        run: ctest --test-dir .local/build -C Release --output-on-failure
      - name: Install
        run: cmake --install .local/build --config Release --prefix .local/install
      - name: Configure installed consumer
        run: cmake -S examples/consumer -B .local/consumer "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/.local/install"
      - name: Build installed consumer
        run: cmake --build .local/consumer --config Release
      - name: Test installed consumer
        run: ctest --test-dir .local/consumer -C Release --output-on-failure
      - name: Configure installed editing consumer
        run: cmake -S examples/editing-consumer -B .local/editing-consumer "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/.local/install"
      - name: Build installed editing consumer
        run: cmake --build .local/editing-consumer --config Release
      - name: Test installed editing consumer
        run: ctest --test-dir .local/editing-consumer -C Release --output-on-failure
      - name: Configure installed triangulation consumer
        run: cmake -S examples/triangulation-consumer -B .local/triangulation-consumer "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/.local/install"
      - name: Build installed triangulation consumer
        run: cmake --build .local/triangulation-consumer --config Release
      - name: Test installed triangulation consumer
        run: ctest --test-dir .local/triangulation-consumer -C Release --output-on-failure

  native-sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record sanitizer compiler
        run: clang++ --version
      - name: Configure address and undefined behavior checks
        run: >-
          cmake -S . -B .local/sanitizers -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Build instrumented native tests
        run: cmake --build .local/sanitizers --parallel 2
      - name: Run instrumented native tests
        run: ctest --test-dir .local/sanitizers --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  native-thread-sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record thread sanitizer compiler
        run: clang++ --version
      - name: Configure race detection separately from address checks
        run: >-
          cmake -S . -B .local/thread-sanitizer -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          "-DCMAKE_CXX_FLAGS=-fsanitize=thread -O1 -g -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread"
      - name: Build instrumented native tests
        run: cmake --build .local/thread-sanitizer --parallel 2
      - name: Run instrumented native tests
        run: ctest --test-dir .local/thread-sanitizer --output-on-failure
        env:
          TSAN_OPTIONS: halt_on_error=1

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build source distribution and wheel from it
        run: |
          python -m pip install build==1.6.1
          python -m build --outdir .local/dist
      - name: Inspect archive contents
        shell: bash
        run: python scripts/check-package.py .local/dist/*.whl .local/dist/*.tar.gz
      - name: Install native producer for independent binding consumer
        run: |
          cmake -S . -B .local/python-native -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build .local/python-native --config Release
          cmake --install .local/python-native --config Release --prefix .local/python-prefix
      - name: Build independent installed-header consumer wheel
        run: python -m pip wheel examples/record-consumer --no-deps --wheel-dir .local/record-wheels "--config-settings=cmake.define.CMAKE_PREFIX_PATH=${{ github.workspace }}/.local/python-prefix"
      - name: Test fresh installed wheels, lifetimes and both import orders
        shell: bash
        run: python scripts/test-installed.py --geometry-wheel .local/dist/*.whl --consumer-wheel .local/record-wheels/*.whl --numpy --reports
