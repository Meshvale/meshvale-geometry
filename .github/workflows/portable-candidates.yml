# SPDX-License-Identifier: Apache-2.0
name: Portable Python development candidates

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            identifier: cp313-manylinux_x86_64
            arch: x86_64
          - os: windows-2022
            identifier: cp313-win_amd64
            arch: AMD64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CIBW_BUILD: ${{ matrix.identifier }}
      CIBW_ARCHS: ${{ matrix.arch }}
      CIBW_DEPENDENCY_VERSIONS: pinned
      CIBW_BUILD_FRONTEND: build
      CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux_2_28_x86_64@sha256:012f4a50472412f18bb2b450c1cce7158434cfae4ae878591c2748a13a30c2be
      CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
        mkdir -p /output && auditwheel show "{wheel}" > /output/dependencies.txt &&
        python -c "import hashlib,pathlib; p=pathlib.Path('{wheel}'); print('Unrepaired SHA256:',hashlib.sha256(p.read_bytes()).hexdigest())" >> /output/dependencies.txt &&
        auditwheel repair --plat manylinux_2_28_x86_64 --wheel-dir "{dest_dir}" "{wheel}" && auditwheel show "{dest_dir}"/*.whl >> /output/dependencies.txt
      CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
        python -m delvewheel show --exclude msvcp140.dll "{wheel}" > "{project}/.local/preview/dependencies-%MESHVALE_BUILD_KIND%.txt" &&
        python -c "import hashlib,pathlib; p=pathlib.Path(r'{wheel}'); print('Unrepaired SHA256:',hashlib.sha256(p.read_bytes()).hexdigest())" >> "{project}/.local/preview/dependencies-%MESHVALE_BUILD_KIND%.txt" &&
        python -m delvewheel repair --exclude msvcp140.dll --wheel-dir "{dest_dir}" "{wheel}" && python -m delvewheel show --exclude msvcp140.dll "{dest_dir}/*.whl" >> "{project}/.local/preview/dependencies-%MESHVALE_BUILD_KIND%.txt"
      CIBW_BEFORE_BUILD_LINUX: >-
        python -m pip install --only-binary=:all: cmake==4.3.1 && python -m pip freeze && cmake --version && c++ --version && ldd --version
      CIBW_BEFORE_BUILD_WINDOWS: >-
        python -m pip install --only-binary=:all: cmake==4.3.1 && python -m pip freeze && cmake --version
      CIBW_TEST_REQUIRES: jsonschema==4.26.0
      CIBW_BEFORE_TEST: >-
        cmake -S "{package}" -B "{package}/.local/portable-native" -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release &&
        cmake --build "{package}/.local/portable-native" --config Release --parallel 2 &&
        cmake --install "{package}/.local/portable-native" --config Release --prefix "{package}/.local/portable-prefix" &&
        python -m pip install --no-deps "{package}/examples/record-consumer" "--config-settings=cmake.define.CMAKE_PREFIX_PATH={package}/.local/portable-prefix"
      CIBW_TEST_COMMAND: >-
        python -I -c "import meshvale_reports as r,sys; assert r.schema_document()[chr(36)+'id']=='urn:meshvale:report-envelope:1'; assert 'meshvale_geometry' not in sys.modules and 'jsonschema' not in sys.modules" &&
        python -I -m unittest discover -s "{package}/tests/python" -v &&
        python -I "{package}/examples/python/inspect_mesh.py" &&
        python -I "{package}/examples/record-consumer/check.py" geometry-first &&
        python -I "{package}/examples/record-consumer/check.py" consumer-first &&
        python -I -m unittest discover -s "{package}/tests/reports" -v &&
        python -m pip check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned packaging frontend
        run: python -m pip install cibuildwheel==4.2.0 build==1.6.1
      - name: Record hosted environment and selected build
        shell: bash
        run: |
          mkdir -p .local/preview
          python -m pip freeze > .local/preview/host-tools.txt
          python -m cibuildwheel --print-build-identifiers > .local/preview/build-identifiers.txt
          python -c "import os,platform,sys; print(platform.platform()); print(sys.version); print('Runner image:',os.environ.get('ImageOS'),os.environ.get('ImageVersion'))" > .local/preview/host.txt
      - name: Build and inspect source distribution
        shell: bash
        run: |
          python -m build --sdist --outdir .local/preview/sdist
          python scripts/check-package.py .local/preview/sdist/*.tar.gz
      - name: Build, inspect and test repaired source candidate
        run: python -m cibuildwheel --output-dir .local/preview/source-wheels
        env:
          CIBW_ENVIRONMENT_WINDOWS: MESHVALE_BUILD_KIND=source
      - name: Rebuild, inspect and test repaired candidate from source archive without Git
        shell: bash
        run: python -m cibuildwheel .local/preview/sdist/*.tar.gz --output-dir .local/preview/wheels
        env:
          CIBW_ENVIRONMENT_WINDOWS: MESHVALE_BUILD_KIND=archive
      - name: Inspect final publication contents and record identities
        shell: bash
        run: |
          python scripts/check-package.py .local/preview/source-wheels/*.whl .local/preview/wheels/*.whl
          python - <<'PY'
          import hashlib, json, os, subprocess, zipfile
          from pathlib import Path
          root = Path('.local/preview')
          artifacts = []
          for path in sorted(root.rglob('*')):
              if path.suffix != '.whl' and not path.name.endswith('.tar.gz'):
                  continue
              item = {'path': path.relative_to(root).as_posix(), 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()}
              if path.suffix == '.whl':
                  with zipfile.ZipFile(path) as archive:
                      names = archive.namelist()
                      wheel = next(name for name in names if name.endswith('.dist-info/WHEEL'))
                      metadata = next(name for name in names if name.endswith('.dist-info/METADATA'))
                      item['wheel_metadata'] = archive.read(wheel).decode()
                      item['package_metadata'] = archive.read(metadata).decode()
                      item['native_files'] = [name for name in names if name.endswith(('.so', '.pyd', '.dll')) or '.so.' in name]
                      item['license_files'] = [name for name in names if '.dist-info/licenses/' in name]
                  expected = os.environ['CIBW_BUILD']
                  assert '-cp313-cp313-' in path.name, path.name
                  assert ('manylinux_2_28_x86_64' in path.name) if 'manylinux' in expected else path.name.endswith('-win_amd64.whl'), path.name
              artifacts.append(item)
          assert len(artifacts) == 3, artifacts
          manifest = {'source_revision': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                      'candidate_only': True, 'mesh_schema': 'meshvale.mesh/1', 'report_schema': 'meshvale.report/1',
                      'cibuildwheel': '4.2.0', 'selected_build': os.environ['CIBW_BUILD'], 'artifacts': artifacts}
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Retain development candidates and their notices
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: geometry-development-${{ matrix.identifier }}
          path: .local/preview
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

