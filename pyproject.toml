# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["scikit-build-core==1.1.1", "nanobind==3.1.0", "setuptools-scm==10.3.4"]
build-backend = "scikit_build_core.build"

[project]
name = "meshvale-geometry"
dynamic = ["version"]
description = "Owned polygon mesh snapshots, extensible attributes and scoped topology inspection"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
authors = [{name = "Meshvale contributors"}]

[project.optional-dependencies]
reports = ["jsonschema==4.26.0"]

[project.urls]
Repository = "https://github.com/Meshvale/meshvale-geometry"
Issues = "https://github.com/Meshvale/meshvale-geometry/issues"

[tool.scikit-build]
minimum-version = "1.1"
wheel.packages = ["python/meshvale_geometry", "python/meshvale_reports"]
install.components = ["python"]
cmake.define.MESHVALE_GEOMETRY_PYTHON = true
cmake.define.BUILD_TESTING = false
sdist.include = [".clang-format", "CMakeLists.txt", "pyproject.toml", "README.md", "AGENTS.md", "ENVIRONMENT.md", "environment.example.json", "LICENSE", "NOTICE", "CHANGELOG.md", "cmake/**", "include/**", "python/bindings.cpp", "python/meshvale_geometry/*.py", "python/meshvale_reports/*.py", "python/meshvale_reports/*.json", "docs/**", "examples/**", "tests/**", "licenses/*.txt", "scripts/*.py"]
sdist.inclusion-mode = "explicit"
sdist.exclude = ["**/__pycache__/**", "**/*.pyc", "**/.local/**", "**/.scratch/**", "**/build/**", "**/references/**"]

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
tag_regex = '^v(?P<version>\d+\.\d+\.\d+)$'
version_file = "python/meshvale_geometry/_version.py"
fallback_version = "0.0.0"
